<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
      }
      .pulsing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#cbd5e1" stroke-width="1" />
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- Ambient Dynamic Orbs (Behind content) -->
  <circle class="pulsing-orb" cx="200" cy="90" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
  <circle class="pulsing-orb" cx="1020" cy="270" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)" />

  <!-- Animated Dynamic Data/Architecture Lines (Background Layer) -->
  <g opacity="0.45">
    <path class="flow-line" d="M 80 300 C 300 240, 500 340, 750 280 S 1050 220, 1150 250" fill="none" stroke="#6366f1" stroke-width="2.5" />
    <path class="flow-line" d="M 50 80 C 280 140, 480 30, 800 110 S 1020 60, 1160 120" fill="none" stroke="#06b6d4" stroke-width="2" />
  </g>

  <!-- Background Decorative Pills/Cards (Positioned aside to not block title) -->
  <g class="floating-card-1" opacity="0.85">
    <!-- Architecture Node 1 (Top Right) -->
    <rect x="940" y="45" width="200" height="52" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="965" cy="71" r="7" fill="#38bdf8" />
    <text x="982" y="75" fill="#f1f5f9" class="badge-text">⚡ Headless &amp; Composable</text>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <!-- Architecture Node 2 (Bottom Right) -->
    <rect x="910" y="240" width="230" height="54" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="935" cy="267" r="7" fill="#a855f7" />
    <text x="952" y="271" fill="#f1f5f9" class="badge-text">🌐 Enterprise Portals &amp; DXP</text>
  </g>

  <!-- Main Content Foreground (Always Visible & Prominent) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="58" width="295" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" />
    <circle cx="16" cy="72" r="4.5" fill="#10b981" />
    <text x="30" y="76" fill="#a5b4fc" class="badge-text" letter-spacing="0.5">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#titleGrad)" class="title-text" font-size="44">Digital Experience &amp; Portal Builders</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="195" fill="#e2e8f0" class="subtitle-text" font-size="20">
      Enterprise DXP • Customer Communities • Open-Source Portal Stacks
    </text>

    <!-- Value Highlights / Feature Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="18" y="21" fill="#cbd5e1" class="badge-text">🚀 SaaS &amp; Cloud DXP</text>

      <!-- Badge 2 -->
      <rect x="165" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="183" y="21" fill="#cbd5e1" class="badge-text">🔓 Open-Source Stacks</text>

      <!-- Badge 3 -->
      <rect x="345" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="363" y="21" fill="#cbd5e1" class="badge-text">💎 Self-Service Portals</text>

      <!-- Badge 4 -->
      <rect x="525" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="543" y="21" fill="#cbd5e1" class="badge-text">📊 Market Dynamics</text>
    </g>
  </g>
</svg>
